name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      validation_mode:
        description: Isolated no-key policy tests or reviewed offline app validation, never deployment
        type: choice
        options: [rollback_preparation, source_policy, offline_app]
        default: rollback_preparation
        required: true
      expected_commit:
        description: Exact reviewed feature commit, never a Production target
        type: string
        required: true
      source_suite:
        description: Reviewed source-policy suite, ignored by rollback mode
        type: choice
        options: [restore, photo, preservation, evidence, publication, backup_completeness, backup_paths, backup_protocol]
        default: restore
        required: false
      staging_artifact_approved:
        description: Explicit approval to transfer compiled Staging dist only; offline_app only
        type: boolean
        default: false
        required: false
      staging_storage_checked_at:
        description: Confirmed free artifact headroom timestamp (UTC ISO milliseconds); offline_app only
        type: string
        default: ''
        required: false

permissions:
  contents: read

jobs:
  release-branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: node --test scripts/release-branch-policy.test.mjs
      - run: node scripts/release-branch-policy.mjs

  verify:
    # Required status check. It passes only when the app gate passed, or when a ready PR
    # changed nothing but Markdown and the app gate was skipped on purpose.
    if: always() && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
    needs: [change-scope, verify-app]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the app gate unless only Markdown changed
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          APP_CHANGED: ${{ needs.change-scope.outputs.app }}
          APP_RESULT: ${{ needs.verify-app.result }}
        run: |
          echo "change-scope=$SCOPE_RESULT app=$APP_CHANGED verify-app=$APP_RESULT"
          if [ "$SCOPE_RESULT" = "success" ] && [ "$APP_CHANGED" = "false" ] && [ "$APP_RESULT" = "skipped" ]; then
            echo "Markdown-only change: app gate not needed."
            exit 0
          fi
          [ "$SCOPE_RESULT" = "success" ] && [ "$APP_CHANGED" = "true" ] && [ "$APP_RESULT" = "success" ]

  change-scope:
    # Reads the PR file list through the API (no checkout, read-only token). Anything that is
    # not Markdown, a rename from a non-Markdown path, a failed lookup or a push means app=true.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.scope.outputs.app }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          app=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if files="$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)')"; then
              if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '\.md$'; then app=false; fi
            fi
          fi
          echo "app=$app" | tee -a "$GITHUB_OUTPUT"

  verify-app:
    # Manual dispatch must not install app dependencies or activate legacy DB tests.
    # Drafts run the cheap branch policy; ready PRs and main pushes keep the app gate.
    if: needs.change-scope.outputs.app == 'true' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
    needs: change-scope
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run audit:production
      # The Sites manifest is only validated when preparing a Sites release, not for Git branch CI.
      - run: npm run migration:check
        env:
          MIGRATION_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      - run: npm run lint
      - run: npm run typecheck
      - name: Verify isolated deployment source adapter
        run: node --test ../../scripts/prepare-sites-source.test.mjs
      - run: npm test
      - name: Verify independent Cloudflare staging config
        run: node --test tests/cloudflare-staging-config.test.mjs
      - name: Verify staging access gate and real Worker asset routing
        run: npm run test:staging-worker

  supabase-integration:
    # Hard-disabled until an owned, non-destructive integration adapter is approved.
    # Inputs cannot reactivate the legacy creation/cleanup suite.
    if: ${{ false }}
    environment: staging
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      APP_ENV: staging
      EXPECTED_SUPABASE_PROJECT_REF: ${{ secrets.EXPECTED_SUPABASE_PROJECT_REF }}
      BLOCKED_SUPABASE_PROJECT_REFS: ${{ secrets.BLOCKED_SUPABASE_PROJECT_REFS }}
      RUN_SUPABASE_INTEGRATION: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SECRET_KEY != '' && secrets.INPUT_ACCESS_CODES != '' && secrets.HTML_ACCESS_CODES != '' && '1' || '0' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      INPUT_ACCESS_CODES: ${{ secrets.INPUT_ACCESS_CODES }}
      HTML_ACCESS_CODES: ${{ secrets.HTML_ACCESS_CODES }}
      WORKSPACE_SESSION_SECRET: ${{ secrets.WORKSPACE_SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Require isolated Staging secrets
        run: |
          test "$RUN_SUPABASE_INTEGRATION" = "1"
          test -n "$EXPECTED_SUPABASE_PROJECT_REF"
          test -n "$BLOCKED_SUPABASE_PROJECT_REFS"
      - run: npm run build
      - run: npm run test:integration

  rollback-dispatch-guard:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require reviewed exact commit and isolated mode
        env:
          EXPECTED_SHA: ${{ inputs.expected_commit }}
          VALIDATION_MODE: ${{ inputs.validation_mode }}
          SOURCE_SUITE: ${{ inputs.source_suite }}
          STAGING_ARTIFACT_APPROVED: ${{ inputs.staging_artifact_approved }}
          STAGING_STORAGE_CHECKED_AT: ${{ inputs.staging_storage_checked_at }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]] || [[ "$GITHUB_SHA" != "$EXPECTED_SHA" ]]; then
            echo '::error::ROLLBACK_DISPATCH_BLOCKED_COMMIT_OR_MODE_MISMATCH'
            exit 1
          fi
          if [[ "$STAGING_ARTIFACT_APPROVED" != false || -n "$STAGING_STORAGE_CHECKED_AT" ]]; then
            [[ "$VALIDATION_MODE" == offline_app && "$STAGING_ARTIFACT_APPROVED" == true && "$STAGING_STORAGE_CHECKED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$ ]] || { echo '::error::STAGING_ARTIFACT_DISPATCH_BLOCKED'; exit 1; }
          fi
          case "$VALIDATION_MODE" in
            rollback_preparation) ;;
            source_policy)
              [[ "$GITHUB_REF" == refs/heads/codex/* && ( "$SOURCE_SUITE" == restore || "$SOURCE_SUITE" == photo || "$SOURCE_SUITE" == preservation || "$SOURCE_SUITE" == evidence || "$SOURCE_SUITE" == publication || "$SOURCE_SUITE" == backup_completeness || "$SOURCE_SUITE" == backup_paths || "$SOURCE_SUITE" == backup_protocol ) ]] || { echo '::error::SOURCE_POLICY_DISPATCH_BLOCKED'; exit 1; }
              ;;
            offline_app)
              [[ "$GITHUB_REF" == refs/heads/codex/* ]] || { echo '::error::OFFLINE_APP_DISPATCH_BLOCKED'; exit 1; }
              ;;
            *) echo '::error::ISOLATED_MODE_NOT_ALLOWLISTED'; exit 1 ;;
          esac

  isolated-rollback-policy:
    needs: rollback-dispatch-guard
    if: github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'rollback_preparation' && needs.rollback-dispatch-guard.result == 'success'
    uses: ./.github/workflows/rollback-preparation.yml

  isolated-source-policy:
    needs: rollback-dispatch-guard
    if: github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'source_policy' && needs.rollback-dispatch-guard.result == 'success'
    uses: ./.github/workflows/source-policy-validation.yml
    with:
      suite: ${{ inputs.source_suite }}

  isolated-offline-app:
    needs: rollback-dispatch-guard
    if: github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'offline_app' && needs.rollback-dispatch-guard.result == 'success'
    uses: ./.github/workflows/offline-app-validation.yml
    with:
      expected_commit: ${{ inputs.expected_commit }}
      staging_artifact_approved: ${{ inputs.staging_artifact_approved }}
      staging_storage_checked_at: ${{ inputs.staging_storage_checked_at }}
