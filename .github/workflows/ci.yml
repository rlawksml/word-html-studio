name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      validation_mode:
        description: No-key isolated rollback policy tests only
        type: choice
        options: [rollback_preparation]
        default: rollback_preparation
        required: true
      expected_commit:
        description: Exact reviewed feature commit, never a Production target
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    # Manual dispatch must not install app dependencies or activate legacy DB tests.
    # Pull requests and main pushes keep the complete existing audit/verify gate.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run audit:production
      - run: npm run validate:deployment-target
        env:
          DEPLOYMENT_TARGET: ${{ github.event_name == 'workflow_dispatch' && 'develop' || (github.base_ref || github.ref_name) }}
      - run: npm run migration:check
        env:
          MIGRATION_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      - run: npm run lint
      - run: npm run typecheck
      - name: Verify isolated deployment source adapter
        run: node --test ../../scripts/prepare-sites-source.test.mjs
      - run: npm test
      - name: Verify independent Cloudflare staging config
        run: node --test tests/cloudflare-staging-config.test.mjs
      - name: Verify staging access gate and real Worker asset routing
        run: npm run test:staging-worker

  supabase-integration:
    # Hard-disabled until an owned, non-destructive integration adapter is approved.
    # Inputs cannot reactivate the legacy creation/cleanup suite.
    if: ${{ false }}
    environment: staging
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      APP_ENV: staging
      EXPECTED_SUPABASE_PROJECT_REF: ${{ secrets.EXPECTED_SUPABASE_PROJECT_REF }}
      BLOCKED_SUPABASE_PROJECT_REFS: ${{ secrets.BLOCKED_SUPABASE_PROJECT_REFS }}
      RUN_SUPABASE_INTEGRATION: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SECRET_KEY != '' && secrets.INPUT_ACCESS_CODES != '' && secrets.HTML_ACCESS_CODES != '' && '1' || '0' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      INPUT_ACCESS_CODES: ${{ secrets.INPUT_ACCESS_CODES }}
      HTML_ACCESS_CODES: ${{ secrets.HTML_ACCESS_CODES }}
      WORKSPACE_SESSION_SECRET: ${{ secrets.WORKSPACE_SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Require isolated Staging secrets
        run: |
          test "$RUN_SUPABASE_INTEGRATION" = "1"
          test -n "$EXPECTED_SUPABASE_PROJECT_REF"
          test -n "$BLOCKED_SUPABASE_PROJECT_REFS"
      - run: npm run build
      - run: npm run test:integration

  rollback-dispatch-guard:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require reviewed exact commit and isolated mode
        env:
          EXPECTED_SHA: ${{ inputs.expected_commit }}
          VALIDATION_MODE: ${{ inputs.validation_mode }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]] || [[ "$GITHUB_SHA" != "$EXPECTED_SHA" ]] || [[ "$VALIDATION_MODE" != rollback_preparation ]]; then
            echo '::error::ROLLBACK_DISPATCH_BLOCKED_COMMIT_OR_MODE_MISMATCH'
            exit 1
          fi

  isolated-rollback-policy:
    needs: rollback-dispatch-guard
    if: github.event_name == 'workflow_dispatch' && needs.rollback-dispatch-guard.result == 'success'
    uses: ./.github/workflows/rollback-preparation.yml
