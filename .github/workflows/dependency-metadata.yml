name: Bounded public dependency metadata preparation

on:
  workflow_call:
    inputs:
      expected_commit:
        required: true
        type: string
      artifact_transfer_approved:
        required: true
        type: boolean
      storage_checked_at:
        required: true
        type: string

permissions:
  contents: read

jobs:
  metadata:
    # A manually approved exception for two public JSON files only. No cache,
    # app source in containers, secrets/environment, DB, deployment or audit.
    if: github.event.repository.private == false && inputs.artifact_transfer_approved == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve metadata in bounded prep and promote only after exact cleanup
        id: metadata
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_commit }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          ARTIFACT_TRANSFER_APPROVED: ${{ inputs.artifact_transfer_approved }}
          STORAGE_CHECKED_AT: ${{ inputs.storage_checked_at }}
        run: |
          set -euo pipefail
          umask 077
          fail() { printf '::error::%s\n' "$1"; exit 1; }
          [[ "$REPOSITORY_PRIVATE" == false && "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/codex/* ]] || fail METADATA_PUBLIC_FEATURE_DISPATCH_REQUIRED
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || fail METADATA_EXACT_COMMIT_REQUIRED
          [[ "$ARTIFACT_TRANSFER_APPROVED" == true && "$STORAGE_CHECKED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$ ]] || fail METADATA_USER_AND_STORAGE_CHECK_REQUIRED
          for tool in /usr/bin/env /usr/bin/realpath /usr/bin/sha256sum /usr/bin/docker /usr/bin/git /usr/bin/ldd /usr/bin/mktemp /usr/bin/cp /usr/bin/mkdir; do
            [[ -f "$tool" && -x "$tool" ]] || fail METADATA_TRUSTED_OS_TOOL_MISSING
          done
          workspace="$(/usr/bin/realpath -e -- "$GITHUB_WORKSPACE")" || fail METADATA_WORKSPACE_UNRESOLVED
          [[ "$workspace" == "$GITHUB_WORKSPACE" ]] || fail METADATA_WORKSPACE_SYMLINK
          node_source="$(command -v node)" || fail METADATA_NODE_MISSING
          npm_source="$(command -v npm)" || fail METADATA_NPM_MISSING
          node_real="$(/usr/bin/realpath -e -- "$node_source")" || fail METADATA_NODE_UNRESOLVED
          npm_real="$(/usr/bin/realpath -e -- "$npm_source")" || fail METADATA_NPM_UNRESOLVED
          case "$node_real" in /usr/*|/opt/*) ;; *) fail METADATA_NODE_UNTRUSTED ;; esac
          case "$npm_real" in /usr/*/npm/bin/npm-cli.js|/opt/*/npm/bin/npm-cli.js) ;; *) fail METADATA_NPM_UNTRUSTED ;; esac
          [[ -f "$node_real" && -x "$node_real" && -f "$npm_real" ]] || fail METADATA_RUNTIME_NOT_REGULAR
          scratch="$(/usr/bin/mktemp -d /tmp/bookstore-metadata-qa.XXXXXXXXXX)" || fail METADATA_SCRATCH_FAILED
          /usr/bin/mkdir -p "$scratch/trusted"
          # Complete native-only closure, reviewed independently and pinned
          # after isolated policy tests. A changed helper blocks execution.
          while read -r expected relative; do
            [[ "$expected" =~ ^[a-f0-9]{64}$ ]] || fail METADATA_SOURCE_REVIEW_REQUIRED
            source_file="$workspace/.github/validation/$relative"
            [[ -f "$source_file" && ! -L "$source_file" && "$(/usr/bin/realpath -e -- "$source_file")" == "$source_file" ]] || fail METADATA_REVIEW_SOURCE_NOT_REGULAR
            actual="$(/usr/bin/sha256sum -- "$source_file")" || fail METADATA_REVIEW_HASH_FAILED
            [[ "${actual%% *}" == "$expected" ]] || fail METADATA_REVIEW_HASH_MISMATCH
            /usr/bin/cp -- "$source_file" "$scratch/trusted/$relative"
          done <<'REVIEWED_CLOSURE'
          9ae488190faaf117b850e4bb36f7a4f2cd593a8a6ce1d7e87d513d096f22ff61 metadata-host-controller.mjs
          d2970c4d04af26edfc15a3ca8c4af55c29823f0779ef1430fcf6233a85da8161 metadata-export-docker.mjs
          1890fc54d0994591dbad27ae561c8d0c4d12ede9703e297b0013f9eedbf508b4 metadata-policy.mjs
          b1505216dbc552cb9ddd284fb4dc7dda4a406064c8226a7bde9a328c91859ed7 metadata-packet.mjs
          2dc411d48560f24ae474a212dcc281cc28267049b6f2d63aacc6a11854a1f402 metadata-file-io.mjs
          a91ca42fead820a5ad11b9b97a7ec4184b798c69b75b0b0860ba848c94114211 metadata-approval.mjs
          1cb4bda22a59d27c186d4995541b0829c812103591581944d1a0160246753002 metadata-retained-check.mjs
          8697c760084187b5a9e5198161262748933ee15f34771396c2d5b491f0bb7b0a metadata-prep-launcher.mjs
          d48f213984390075ca78c49b3b78662bb7ef6dc792997d9f8a43c5a675671d9d metadata-consumer-launcher.mjs
          df94847c6bd89ed5656e0e5c107fccb059d898851fa1873523718c9586ca9723 offline-baseline.mjs
          abe01b3a84116e30cea9d85ae71f292f23d7611c1b3ac3dcce42e8c2ea013c51 offline-host-support.mjs
          f7e596086f32463a9a98421acf3d3c963fc1844d56cd0762d224a87e71fc67b1 offline-host-source.mjs
          9fc295a1ea304d7cfb4075168f169bad4b484dea787426a8d05e5199eced9023 offline-host-runtime.mjs
          f08f44f8407f481356dd921647850d8a874b9eb9315c7207e0fedd872bc04476 offline-host-docker.mjs
          18e576e8d2f0123a38ce28d76ea939099b1ae98705115868f860cf5cca72861b offline-sandbox-common.mjs
          499ed0e6a76ded0ba21350c381107651eb6cb0cf73e5160102050236f7315cd5 offline-app.Dockerfile
          REVIEWED_CLOSURE
          /usr/bin/env -i PATH=/usr/bin:/bin TZ=UTC \
            "$node_real" --no-addons "$scratch/trusted/metadata-host-controller.mjs" \
            "$workspace" "$EXPECTED_SHA" "$scratch" "$node_real" "$npm_real" \
            "$ARTIFACT_TRANSFER_APPROVED" "$STORAGE_CHECKED_AT"
          # Source/toolchain consumers have all terminated. The parent-private
          # directory contains exactly these two no-follow regular single-link
          # files. Check again immediately before handing paths to the official
          # uploader, whose own glob/symlink behavior is NOT a safety boundary.
          /usr/bin/env -i PATH=/usr/bin:/bin TZ=UTC \
            "$node_real" --no-addons "$scratch/trusted/metadata-retained-check.mjs" "$scratch"
          printf 'package_file=%s\n' "$scratch/exported/package.json" >> "$GITHUB_OUTPUT"
          printf 'lock_file=%s\n' "$scratch/exported/package-lock.json" >> "$GITHUB_OUTPUT"
      - name: Transfer exactly the two verified public manifests for one day
        if: success()
        # Official v7.0.2 immutable commit, reviewed separately by the parent.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-manifests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.metadata.outputs.package_file }}
            ${{ steps.metadata.outputs.lock_file }}
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 1
          compression-level: 9
